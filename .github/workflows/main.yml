name: CI
on:
    push:
      branches:
        - master
        - develop
        - master
        - feature/*
    pull_request:
      branches:
        - main
        - master
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, 3.10, 3.11]
    steps:
    - name: Checkout
      run: echo File Path: ${{ github.workspace }}/logs/log_file.txt && echo "Log File Contents:" && echo && cat ${{ github.workspace }}/logs/log_file.txt
      uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      env:
        MATRIX_PYTHON_VERSION: ${{ matrix.python-version }}
      uses: actions/setup-python@v2.3.2
      if: always()
      run: |
        - name: Install flake8 and tox
          run: sudo apt-get install flake8 tox -y
        echo File Path: ${{ github.workspace }}/log_file.txt && echo "Log File Contents:" && echo && echo "Log File Contents:" && echo && cat ${{ github.workspace }}/log_file.txt

      - name: Run tests with Flake8 and Tox
  run: |
    tox
    flake8
    cat ${{ github.workspace }}/log_file.txt
