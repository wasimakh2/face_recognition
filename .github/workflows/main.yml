      run: echo File Path: ${{ github.workspace }}/log_file.txt && echo "Log File Contents:" && echo && cat ${{ github.workspace }}/log_file.txt
      uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      env:
        MATRIX_PYTHON_VERSION: ${{ matrix.python-version }}
      uses: actions/setup-python@v2.3.2
      if: always()
      run: |
        echo File Path: ${{ github.workspace }}/log_file.txt && echo "Log File Contents:" && echo && echo "Log File Contents:" && echo && cat ${{ github.workspace }}/log_file.txt

      - name: Run tests
  run: tox
        cat ${{ github.workspace }}/log_file.txt
        if: always() || needs(Setup environment)
          run: |
            cat ${{ github.workspace }}/log_file.txt
          cat ${{ github.workspace }}/log_file.txt
