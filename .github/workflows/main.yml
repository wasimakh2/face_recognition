        if: failure()
          run: |
            cat ${{ github.workspace }}/log_file.txt
          cat ${{ github.workspace }}/log_file.txt
    run: |
          echo File Path: ${{ github.workspace }}/log_file.txt && echo "Log File Contents:" && echo && cat ${{ github.workspace }}/log_file.txt
- name: Run tests
