name: CI
on:
    push:
      branches:
        - main
        - develop
        - master
        - feature/*
    pull_request:
      branches:
        - main
        - master
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, 3.10, 3.11]
    steps:
